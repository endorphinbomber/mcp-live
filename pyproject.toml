[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tonematch"
version = "0.1.0"
description = "Closed-loop tone and mix matching of a MIDI rendition against a reference track in Ableton Live (via ableton-live-mcp)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "soundfile>=0.12",
    "pyloudnorm>=0.1.1",
    "mido>=1.3",
    "optuna>=3.4",
]

[project.optional-dependencies]
separate = ["demucs>=4.0"]
mcp = ["mcp>=1.2"]
dev = ["pytest>=7"]

[project.scripts]
tonematch = "tonematch.cli:main"

[tool.setuptools.packages.find]
include = ["tonematch*"]

[tool.setuptools.package-data]
tonematch = ["*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
